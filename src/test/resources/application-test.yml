spring:
  datasource:
    url: jdbc:h2:mem:evops_test;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

reconcile:
  scheduling-enabled: false
  tolerance: 0.05
  engine-mode: PARALLEL
  cutover-batch-size: 2
